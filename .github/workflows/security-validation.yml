name: Security compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIPENV_DONT_LOAD_ENV: "1"
      PIPENV_VENV_IN_PROJECT: "1"
      PIPENV_IGNORE_VIRTUALENVS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify and install genuine lock
        run: |
          python -m pip install --upgrade pip==26.2.2 setuptools==84.2.1 pipenv==2026.10.2
          pipenv verify
          pipenv requirements > requirements.generated.txt
          diff -u requirements.txt requirements.generated.txt
          pipenv sync
          pipenv run python -m pip install --upgrade pip==26.2.2 setuptools==84.2.1
          pipenv run python -m pip check
          pipenv run python -m pip inspect > dependency-tree.json
          pipenv run python -m pip list --format=json > resolved.json
          pipenv run python -c "import pip; from pathlib import Path; print((Path(pip.__file__).parent / '_vendor/vendor.txt').read_text())" > installer-vendors.txt
          pipenv run python -c "import json, setuptools; from pathlib import Path; from importlib.metadata import distributions; print(json.dumps([{'name': d.metadata['Name'], 'version': d.version} for d in distributions(path=[str(Path(setuptools.__file__).parent / '_vendor')])]))" > setuptools-vendors.json
          pipenv run python -m compileall -q read.py populator.py
      - name: Offline parser and SDK compatibility
        run: |
          pipenv run python read.py example.txt
          pipenv run python - <<'PY'
          import firebase_admin, grpc, requests, rsa
          from google.auth.credentials import AnonymousCredentials
          from google.cloud import firestore
          from google.cloud.firestore_v1.types import Document
          from google.protobuf import json_format

          client = firestore.Client(project="offline-security-smoke", credentials=AnonymousCredentials())
          collection = client.collection("course_outline").document("unilag").collection("engineering")
          assert collection.path == "course_outline/unilag/engineering"
          document = Document(name="projects/offline/databases/(default)/documents/demo/one")
          assert Document.deserialize(Document.serialize(document)).name == document.name
          client.close()
          print("Firebase", firebase_admin.__version__, "gRPC", grpc.__version__, "offline reference/protobuf smoke passed.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolved-dependencies
          path: |
            dependency-tree.json
            resolved.json
            installer-vendors.txt
            setuptools-vendors.json
          retention-days: 7
